appId: com.bcsdlab.koin.stage
name: Guest dining entry and meal content change
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: '오늘의 식단'
    timeout: 60000
- tapOn:
    id: home-dining-view-all
- extendedWaitUntil:
    visible: '아침'
    timeout: 30000
- tapOn: '아침'
- extendedWaitUntil:
    visible:
      id: dining-menu-0
    timeout: 30000
- takeScreenshot: dining-breakfast
- tapOn: '저녁'
- extendedWaitUntil:
    visible:
      id: dining-menu-2
    timeout: 30000
- assertNotVisible:
    id: dining-menu-0
- takeScreenshot: dining-dinner
